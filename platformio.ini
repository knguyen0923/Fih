; ============================================================================
; Fih — ESP32 (WROVER, PSRAM) push-to-talk Gemini voice assistant
; PlatformIO project configuration
; ============================================================================
;
; PlatformIO reads this file to know which chip/board profile to target, which
; framework (Arduino vs raw ESP-IDF) to build against, and which extra
; libraries to fetch. Everything under [env:wrover] is one "build environment" —
; you could add more [env:...] sections later (e.g. a second board), but this
; project only needs one for the actual firmware. [env:native] (below) is a
; second environment used only for running unit tests on your own machine.
;
; board = upesy_wrover targets a generic no-name WROVER breakout board. If your
; specific board doesn't behave well under that id (e.g. wrong default flash
; size), switch to:
;   board = esp32dev
; and keep the same build_flags below — PSRAM support comes from the flags,
; not the board id, so either board setting works for this firmware.

[platformio]
; Plain `pio run` / `pio run -t upload` targets only the real firmware build
; by default -- the native test environment below is only ever invoked
; explicitly via `pio test -e native`, never accidentally built/flashed.
default_envs = wrover

[env:wrover]
platform = espressif32   ; the chip family support package (compiler, SDK, upload tools)
board = upesy_wrover      ; board profile: pin defaults, flash size, upload speed
framework = arduino       ; use the Arduino core for ESP32, not raw ESP-IDF

monitor_speed = 115200    ; baud rate for `pio device monitor` (must match Serial.begin() in main.cpp)

build_flags =
    ; Tells the Arduino core this board has PSRAM, enabling ESP.getFreePsram()
    ; and MALLOC_CAP_SPIRAM allocations. Without this, PSRAM is invisible to
    ; the firmware even if the chip physically has it.
    -DBOARD_HAS_PSRAM
    ; Works around a silicon errata on early ESP32 revisions where the CPU
    ; cache can corrupt PSRAM reads/writes under certain access patterns.
    ; Harmless to include even on newer silicon that doesn't need it.
    -mfix-esp32-psram-cache-issue

lib_deps =
    ; JSON parsing/building for the two Gemini API calls. Base64 encode/decode
    ; is hand-rolled in src/base64_core.cpp instead of pulled in as a dependency.
    bblanchon/ArduinoJson@^7

; ----------------------------------------------------------------------------
; [env:native] — unit tests, run on your own machine, no ESP32 required
; ----------------------------------------------------------------------------
; Only src/base64_core.cpp and src/wav.cpp get compiled here -- audio.cpp
; (I2S), gemini.cpp (WiFi/HTTPS), base64.cpp (Arduino String), and main.cpp
; (setup()/loop()) all depend on Arduino/ESP-IDF headers that don't exist on
; a desktop target, and are excluded accordingly. Hardware-dependent behavior
; is validated on real hardware instead, following the README's "Build
; phases" section -- this environment only covers the pure, non-hardware
; logic (base64 codec, WAV header building).
;
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
; PlatformIO doesn't pull src/ into a test build by default (to avoid
; colliding with src/main.cpp's setup()/loop()) -- this opts back in, combined
; with build_src_filter below to only bring in the hardware-independent files.
test_build_src = yes
build_src_filter =
    +<*>
    -<main.cpp>
    -<audio.cpp>
    -<gemini.cpp>
    -<base64.cpp>
